[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axes-client"
version = "0.1.0"
description = "Python client for the Axes data API"
readme = "README.md"
authors = [
    { name = "Axes, Inc.", email = "info@axes.com" },
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "click>=8.1",
    "pyarrow>=24.0.0",
]

[project.scripts]
axes = "axes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/axes"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-httpx",
]

